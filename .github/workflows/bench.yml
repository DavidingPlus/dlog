name: Bench

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: x86_64
            plat: windows
            xmake-arch: x64
            runs-on: windows-latest

          - os: ubuntu
            arch: x86_64
            plat: linux
            xmake-arch: x86_64
            runs-on: ubuntu-latest

          - os: ubuntu
            arch: arm64
            plat: linux
            xmake-arch: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure XMake
      run: |
        touch snippet/SkipList/.buildme
        xmake f -m release -p ${{ matrix.plat }} -a ${{ matrix.xmake-arch }} -y

    - name: Build Bench
      working-directory: ${{github.workspace}}
      run: xmake build dlog-bench

    - name: Run Bench
      working-directory: ${{github.workspace}}
      run: xmake run dlog-bench
